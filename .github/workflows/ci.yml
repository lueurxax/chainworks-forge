name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Guard direct Run insertion
        run: |
          if grep -rn 'Run(' --include='*.swift' "Chainworks Forge/" \
             | grep -v 'RunRepository.swift' | grep -v 'Run.swift' \
             | grep -v 'RunStatus' | grep -v 'RunRepositoryError' \
             | grep -v '// RunRepository-exempt' | grep -q '.'; then
            echo "::error::Direct Run construction found outside RunRepository"
            exit 1
          fi

      - name: Build
        run: |
          xcodebuild -project 'Chainworks Forge.xcodeproj' \
            -scheme 'Chainworks Forge' \
            -destination 'platform=macOS' \
            build

      - name: Test
        run: |
          xcodebuild -project 'Chainworks Forge.xcodeproj' \
            -scheme 'Chainworks Forge' \
            -destination 'platform=macOS' \
            test
