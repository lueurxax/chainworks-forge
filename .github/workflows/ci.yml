name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Fast Gate
        run: ./scripts/test-gate.sh fast

  ui-smoke-gate:
    runs-on: macos-15
    needs: fast-gate
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: UI Smoke Gate
        run: ./scripts/test-gate.sh ui-smoke
