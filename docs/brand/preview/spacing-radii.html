<!doctype html>
<html><head><meta charset="utf-8"><title>Corner radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);}
  body{font-family:var(--font-text);color:var(--label);-webkit-font-smoothing:antialiased;height:170px;overflow:hidden;}
  .card{padding:20px 24px;height:100%;box-sizing:border-box;}
  .lbl{font:var(--t-caption2);letter-spacing:var(--tracking-wide);color:var(--label-tertiary);text-transform:uppercase;font-weight:600;}
  .row{display:flex;gap:12px;align-items:center;}
  .row.tight{gap:6px;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .meta{display:flex;flex-direction:column;gap:2px;}
  .meta .name{font:var(--t-caption1);font-weight:600;color:var(--label);}
  .meta .val{font-family:var(--font-mono);font-size:10.5px;color:var(--label-secondary);}
  .capsule{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;font:var(--t-caption1);font-weight:600;border-radius:999px;}
</style></head>
<body><div class="card">
<div class="stack" style="gap:8px;">
  <div class="lbl">Continuous corners · Apple HIG</div>
  <div style="display:flex;gap:14px;align-items:center;">
    
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:60px;height:60px;background:#fff;border-radius:10px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.05);"></div>
        <div style="font:var(--t-caption1);font-weight:600;">10</div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);">control</div>
      </div>
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:60px;height:60px;background:#fff;border-radius:12px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.05);"></div>
        <div style="font:var(--t-caption1);font-weight:600;">12</div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);">small card</div>
      </div>
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:60px;height:60px;background:#fff;border-radius:14px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.05);"></div>
        <div style="font:var(--t-caption1);font-weight:600;">14</div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);">card</div>
      </div>
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:60px;height:60px;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.05);"></div>
        <div style="font:var(--t-caption1);font-weight:600;">16</div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);">panel</div>
      </div>
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:60px;height:60px;background:#fff;border-radius:20px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.05);"></div>
        <div style="font:var(--t-caption1);font-weight:600;">20</div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);">sheet</div>
      </div>
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:60px;height:60px;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.05);"></div>
        <div style="font:var(--t-caption1);font-weight:600;">pill</div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);">pill</div>
      </div>
  </div>
</div>
</div></body></html>
