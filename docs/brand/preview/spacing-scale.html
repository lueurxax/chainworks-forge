<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale (4-pt)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);}
  body{font-family:var(--font-text);color:var(--label);-webkit-font-smoothing:antialiased;height:170px;overflow:hidden;}
  .card{padding:20px 24px;height:100%;box-sizing:border-box;}
  .lbl{font:var(--t-caption2);letter-spacing:var(--tracking-wide);color:var(--label-tertiary);text-transform:uppercase;font-weight:600;}
  .row{display:flex;gap:12px;align-items:center;}
  .row.tight{gap:6px;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .meta{display:flex;flex-direction:column;gap:2px;}
  .meta .name{font:var(--t-caption1);font-weight:600;color:var(--label);}
  .meta .val{font-family:var(--font-mono);font-size:10.5px;color:var(--label-secondary);}
  .capsule{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;font:var(--t-caption1);font-weight:600;border-radius:999px;}
</style></head>
<body><div class="card">
<div class="stack" style="gap:8px;">
  <div class="lbl">--sp-1 … --sp-9 · ForgeSpacing facade</div>
  <div style="display:flex;gap:14px;align-items:flex-end;">
    
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:4px;height:4px;background:#0A84FF;border-radius:4px;opacity:0.85;"></div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);font-weight:600;">4</div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--label-tertiary);">--sp-1</div>
      </div>
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:8px;height:8px;background:#0A84FF;border-radius:4px;opacity:0.85;"></div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);font-weight:600;">8</div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--label-tertiary);">--sp-2</div>
      </div>
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:12px;height:12px;background:#0A84FF;border-radius:4px;opacity:0.85;"></div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);font-weight:600;">12</div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--label-tertiary);">--sp-3</div>
      </div>
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:16px;height:16px;background:#0A84FF;border-radius:4px;opacity:0.85;"></div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);font-weight:600;">16</div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--label-tertiary);">--sp-4</div>
      </div>
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:20px;height:20px;background:#0A84FF;border-radius:4px;opacity:0.85;"></div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);font-weight:600;">20</div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--label-tertiary);">--sp-5</div>
      </div>
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:24px;height:24px;background:#0A84FF;border-radius:4px;opacity:0.85;"></div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);font-weight:600;">24</div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--label-tertiary);">--sp-6</div>
      </div>
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:32px;height:32px;background:#0A84FF;border-radius:4px;opacity:0.85;"></div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);font-weight:600;">32</div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--label-tertiary);">--sp-7</div>
      </div>
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:40px;height:40px;background:#0A84FF;border-radius:4px;opacity:0.85;"></div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);font-weight:600;">40</div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--label-tertiary);">--sp-8</div>
      </div>
      <div class="stack" style="gap:6px;align-items:center;">
        <div style="width:56px;height:56px;background:#0A84FF;border-radius:4px;opacity:0.85;"></div>
        <div style="font:var(--t-caption2);color:var(--label-tertiary);font-weight:600;">56</div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--label-tertiary);">--sp-9</div>
      </div>
  </div>
</div>
</div></body></html>
