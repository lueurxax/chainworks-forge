<!doctype html>
<html><head><meta charset="utf-8"><title>Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);}
  body{
    font-family:var(--font-text);color:var(--label);
    -webkit-font-smoothing:antialiased;
    padding:20px 24px;box-sizing:border-box;
  }
  .stack{display:flex;flex-direction:column;gap:14px;}
  .lbl{
    font:var(--t-caption2);
    letter-spacing:0.05em;
    color:var(--label-tertiary);
    text-transform:uppercase;
    font-weight:600;
  }
  .meta{
    font:var(--t-caption1);
    color:var(--label-secondary);
    margin-top:2px;
  }

  /* Dark cinematic stage — matches hero panel atmosphere */
  .stage{
    position:relative;
    border-radius:14px;
    overflow:hidden;
    padding:64px 56px 72px;
    background:
      radial-gradient(120% 80% at 50% 50%, #1A2433 0%, #0E1623 55%, #04080D 100%);
    box-shadow:
      0 1px 2px rgba(4,8,13,0.20),
      0 14px 36px rgba(4,8,13,0.32);
  }
  .stage::after{
    content:"";
    position:absolute;inset:0;
    background: radial-gradient(50% 30% at 50% 60%, rgba(255,255,255,0.04), transparent 70%);
    pointer-events:none;
  }

  .lockup{
    position:relative;
    text-align:center;
    color:#FAFBFD;
  }
  .lockup .name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:54px;
    line-height:1;
    letter-spacing:0.04em;
    color:#FAFBFD;
    text-transform:uppercase;
  }
  /* Divider rule with FORGE between, mirroring hero panel */
  .lockup .rule{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-top:22px;
  }
  .lockup .rule .line{
    flex:1;
    max-width:200px;
    height:1px;
    background:linear-gradient(
      to right,
      rgba(163,175,192,0) 0%,
      rgba(163,175,192,0.55) 50%,
      rgba(163,175,192,0) 100%
    );
  }
  .lockup .sub{
    font-family:var(--font-display);
    font-weight:500;
    font-size:22px;
    line-height:1;
    letter-spacing:0.42em;
    /* trailing letter-spacing pads right side; pull back to optical center */
    padding-left:0.42em;
    color:rgba(235,235,245,0.86);
    text-transform:uppercase;
  }
  /* Tiny gold glint under the wordmark — signature element from hero panel */
  .lockup .glint{
    margin: 26px auto 0;
    width:160px;
    height:1px;
    background: linear-gradient(
      to right,
      rgba(245,154,43,0) 0%,
      rgba(245,154,43,0.85) 50%,
      rgba(245,154,43,0) 100%
    );
    box-shadow: 0 0 12px rgba(245,154,43,0.45);
  }

  /* Spec strip below the stage */
  .specs{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:10px;
    padding:14px 18px;
    background:var(--bg-elevated);
    border-radius:10px;
    box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.06);
  }
  .spec{display:flex;flex-direction:column;gap:2px;}
  .spec .k{font:var(--t-caption2);color:var(--label-tertiary);text-transform:uppercase;font-weight:600;letter-spacing:0.05em;}
  .spec .v{font-family:var(--font-mono);font-size:11.5px;color:var(--label);}
</style></head>
<body>

<div class="stack">
  <div>
    <div class="lbl">Wordmark · display only</div>
    <div class="meta">Splash, hero, deck title. Never used as a UI label or in body copy.</div>
  </div>

  <div class="stage">
    <div class="lockup">
      <div class="name">CHAINWORKS</div>
      <div class="rule">
        <div class="line"></div>
        <div class="sub">FORGE</div>
        <div class="line"></div>
      </div>
      <div class="glint"></div>
    </div>
  </div>

  <div class="specs">
    <div class="spec"><div class="k">Family</div><div class="v">Display</div></div>
    <div class="spec"><div class="k">CHAINWORKS</div><div class="v">600 / 0.04 em</div></div>
    <div class="spec"><div class="k">FORGE</div><div class="v">500 / 0.42 em</div></div>
    <div class="spec"><div class="k">Glint</div><div class="v">#F59A2B · 1px</div></div>
  </div>
</div>

</body></html>
