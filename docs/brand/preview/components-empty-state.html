<!doctype html>
<html><head><meta charset="utf-8"><title>Empty state</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);}
  body{font-family:var(--font-text);color:var(--label);-webkit-font-smoothing:antialiased;height:220px;overflow:hidden;}
  .card{padding:20px 24px;height:100%;box-sizing:border-box;}
  .lbl{font:var(--t-caption2);letter-spacing:var(--tracking-wide);color:var(--label-tertiary);text-transform:uppercase;font-weight:600;}
  .row{display:flex;gap:12px;align-items:center;}
  .row.tight{gap:6px;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .meta{display:flex;flex-direction:column;gap:2px;}
  .meta .name{font:var(--t-caption1);font-weight:600;color:var(--label);}
  .meta .val{font-family:var(--font-mono);font-size:10.5px;color:var(--label-secondary);}
  .capsule{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;font:var(--t-caption1);font-weight:600;border-radius:999px;}
</style></head>
<body><div class="card">
<div class="stack" style="gap:8px;align-items:center;text-align:center;padding:8px 12px;">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h7"/></svg>
  <div style="font:600 17px/22px var(--font-display);">No runs yet</div>
  <div style="font:var(--t-footnote);color:var(--label-secondary);max-width:360px;">Capture an idea or import a YAML workflow to compile a run snapshot.</div>
  <button style="margin-top:6px;font:600 13px/18px var(--font-text);background:#0A84FF;color:#fff;border:0;padding:7px 14px;border-radius:8px;">Capture idea</button>
</div>
</div></body></html>
