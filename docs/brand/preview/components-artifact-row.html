<!doctype html>
<html><head><meta charset="utf-8"><title>Artifact row</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);}
  body{font-family:var(--font-text);color:var(--label);-webkit-font-smoothing:antialiased;height:240px;overflow:hidden;}
  .card{padding:20px 24px;height:100%;box-sizing:border-box;}
  .lbl{font:var(--t-caption2);letter-spacing:var(--tracking-wide);color:var(--label-tertiary);text-transform:uppercase;font-weight:600;}
  .row{display:flex;gap:12px;align-items:center;}
  .row.tight{gap:6px;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .meta{display:flex;flex-direction:column;gap:2px;}
  .meta .name{font:var(--t-caption1);font-weight:600;color:var(--label);}
  .meta .val{font-family:var(--font-mono);font-size:10.5px;color:var(--label-secondary);}
  .capsule{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;font:var(--t-caption1);font-weight:600;border-radius:999px;}
</style></head>
<body><div class="card">
<div class="stack" style="gap:6px;">
  
    <div class="row" style="background:#fff;padding:8px 12px;border-radius:10px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.06);gap:10px;">
      <div style="width:22px;height:22px;border-radius:6px;background:color-mix(in srgb, #0A84FF 16%, transparent);color:#0A84FF;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;font-weight:700;">{}</div>
      <div class="stack" style="gap:1px;flex:1;">
        <div style="font:600 12.5px/16px var(--font-text);">run-plan.json</div>
        <div style="font:var(--t-caption2);color:var(--label-secondary);font-family:var(--font-mono);text-transform:none;letter-spacing:0;">frozen · sha256:8f3a…b9</div>
      </div>
      <div style="font:var(--t-caption1);color:var(--label-tertiary);font-family:var(--font-mono);">12 KB</div>
    </div>
    <div class="row" style="background:#fff;padding:8px 12px;border-radius:10px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.06);gap:10px;">
      <div style="width:22px;height:22px;border-radius:6px;background:color-mix(in srgb, #34C759 16%, transparent);color:#34C759;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;font-weight:700;">D</div>
      <div class="stack" style="gap:1px;flex:1;">
        <div style="font:600 12.5px/16px var(--font-text);">review-report.md</div>
        <div style="font:var(--t-caption2);color:var(--label-secondary);font-family:var(--font-mono);text-transform:none;letter-spacing:0;">approved · stage 4</div>
      </div>
      <div style="font:var(--t-caption1);color:var(--label-tertiary);font-family:var(--font-mono);">4.2 KB</div>
    </div>
    <div class="row" style="background:#fff;padding:8px 12px;border-radius:10px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.06);gap:10px;">
      <div style="width:22px;height:22px;border-radius:6px;background:color-mix(in srgb, #FF9F0A 16%, transparent);color:#FF9F0A;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;font-weight:700;">D</div>
      <div class="stack" style="gap:1px;flex:1;">
        <div style="font:600 12.5px/16px var(--font-text);">proposal.diff</div>
        <div style="font:var(--t-caption2);color:var(--label-secondary);font-family:var(--font-mono);text-transform:none;letter-spacing:0;">+128 / −42</div>
      </div>
      <div style="font:var(--t-caption1);color:var(--label-tertiary);font-family:var(--font-mono);">7.8 KB</div>
    </div>
    <div class="row" style="background:#fff;padding:8px 12px;border-radius:10px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.06);gap:10px;">
      <div style="width:22px;height:22px;border-radius:6px;background:color-mix(in srgb, #8E8E93 16%, transparent);color:#8E8E93;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;font-weight:700;">D</div>
      <div class="stack" style="gap:1px;flex:1;">
        <div style="font:600 12.5px/16px var(--font-text);">run-report.md</div>
        <div style="font:var(--t-caption2);color:var(--label-secondary);font-family:var(--font-mono);text-transform:none;letter-spacing:0;">sealed</div>
      </div>
      <div style="font:var(--t-caption1);color:var(--label-tertiary);font-family:var(--font-mono);">9.1 KB</div>
    </div>
</div>
</div></body></html>
