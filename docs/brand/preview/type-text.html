<!doctype html>
<html><head><meta charset="utf-8"><title>Text styles</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);}
  body{font-family:var(--font-text);color:var(--label);-webkit-font-smoothing:antialiased;height:200px;overflow:hidden;}
  .card{padding:20px 24px;height:100%;box-sizing:border-box;}
  .lbl{font:var(--t-caption2);letter-spacing:var(--tracking-wide);color:var(--label-tertiary);text-transform:uppercase;font-weight:600;}
  .row{display:flex;gap:12px;align-items:center;}
  .row.tight{gap:6px;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .meta{display:flex;flex-direction:column;gap:2px;}
  .meta .name{font:var(--t-caption1);font-weight:600;color:var(--label);}
  .meta .val{font-family:var(--font-mono);font-size:10.5px;color:var(--label-secondary);}
  .capsule{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;font:var(--t-caption1);font-weight:600;border-radius:999px;}
</style></head>
<body><div class="card">
<div class="stack" style="gap:6px;">
  <div style="font:600 15px/20px var(--font-text);">Headline — sectionHeader</div>
  <div style="font:400 15px/20px var(--font-text);">Body — Resume run after operator review</div>
  <div style="font:400 14px/19px var(--font-text);">Callout — secondary action copy</div>
  <div style="font:400 13px/18px var(--font-text);color:var(--label-secondary);">Subheadline — supporting</div>
  <div style="font:400 12px/16px var(--font-text);color:var(--label-secondary);">Footnote — supporting</div>
  <div style="font:500 11px/13px var(--font-text);color:var(--label-tertiary);text-transform:uppercase;letter-spacing:0.04em;">Caption — micro</div>
</div>
</div></body></html>
