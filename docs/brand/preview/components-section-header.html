<!doctype html>
<html><head><meta charset="utf-8"><title>Section header</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);}
  body{font-family:var(--font-text);color:var(--label);-webkit-font-smoothing:antialiased;height:200px;overflow:hidden;}
  .card{padding:20px 24px;height:100%;box-sizing:border-box;}
  .lbl{font:var(--t-caption2);letter-spacing:var(--tracking-wide);color:var(--label-tertiary);text-transform:uppercase;font-weight:600;}
  .row{display:flex;gap:12px;align-items:center;}
  .row.tight{gap:6px;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .meta{display:flex;flex-direction:column;gap:2px;}
  .meta .name{font:var(--t-caption1);font-weight:600;color:var(--label);}
  .meta .val{font-family:var(--font-mono);font-size:10.5px;color:var(--label-secondary);}
  .capsule{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;font:var(--t-caption1);font-weight:600;border-radius:999px;}
</style></head>
<body><div class="card">
<div class="stack" style="gap:6px;">
  <div class="row" style="gap:8px;align-items:flex-start;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px;"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <div class="stack" style="gap:1px;">
      <div style="font:600 15px/20px var(--font-text);">Pending approvals</div>
      <div style="font:var(--t-footnote);color:var(--label-secondary);">2 runs waiting on operator review</div>
    </div>
  </div>
  <hr style="border:0;border-top:0.5px solid var(--separator);margin:8px 0;">
  <div class="row" style="gap:8px;align-items:flex-start;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34C759" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px;"><path d="M5 12l4 4L19 6"/></svg>
    <div class="stack" style="gap:1px;">
      <div style="font:600 15px/20px var(--font-text);">Recent completions</div>
      <div style="font:var(--t-footnote);color:var(--label-secondary);">Last 24h · grouped by workflow</div>
    </div>
  </div>
</div>
</div></body></html>
