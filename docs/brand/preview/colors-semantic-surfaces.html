<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic surfaces (light)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);}
  body{font-family:var(--font-text);color:var(--label);-webkit-font-smoothing:antialiased;height:150px;overflow:hidden;}
  .card{padding:20px 24px;height:100%;box-sizing:border-box;}
  .lbl{font:var(--t-caption2);letter-spacing:var(--tracking-wide);color:var(--label-tertiary);text-transform:uppercase;font-weight:600;}
  .row{display:flex;gap:12px;align-items:center;}
  .row.tight{gap:6px;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .swatch{width:64px;height:64px;border-radius:14px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.04);}
  .sw-md{width:48px;height:48px;border-radius:10px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.08);}
  .sw-sm{width:32px;height:32px;border-radius:8px;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.08);}
  .meta{display:flex;flex-direction:column;gap:2px;}
  .meta .name{font:var(--t-caption1);font-weight:600;color:var(--label);}
  .meta .val{font-family:var(--font-mono);font-size:10.5px;color:var(--label-secondary);}
  .capsule{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;font:var(--t-caption1);font-weight:600;border-radius:999px;background:color-mix(in srgb, currentColor 14%, transparent);}
  .capsule.sm{padding:2px 7px;font-size:10px;}
  .ico{width:14px;height:14px;display:inline-block;}
  hr{border:0;border-top:0.5px solid var(--separator);margin:0;}
</style></head>
<body><div class="card">
  <div class="stack">
    <div class="lbl">App canvas / elevated / fill</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
      <div class="stack" style="gap:6px;">
        <div class="sw-md" style="background:#F2F2F7;width:100%;height:46px;"></div>
        <div class="meta"><span class="name">canvas</span><span class="val">#F2F2F7</span></div>
      </div><div class="stack" style="gap:6px;">
        <div class="sw-md" style="background:#FFFFFF;width:100%;height:46px;"></div>
        <div class="meta"><span class="name">elevated</span><span class="val">#FFFFFF</span></div>
      </div><div class="stack" style="gap:6px;">
        <div class="sw-md" style="background:#F9F9FB;width:100%;height:46px;"></div>
        <div class="meta"><span class="name">tertiary</span><span class="val">#F9F9FB</span></div>
      </div><div class="stack" style="gap:6px;">
        <div class="sw-md" style="background:rgba(120,120,128,0.16);width:100%;height:46px;"></div>
        <div class="meta"><span class="name">fill-2</span><span class="val">rgba(120,120,128,0.16)</span></div>
      </div>
    </div>
  </div>
</div></body></html>
