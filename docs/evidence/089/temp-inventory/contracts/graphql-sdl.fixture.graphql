"""
P089 Managed Temporary Artifact Inventory — Executable GraphQL SDL fixture.
Status: reconciled with the shipped schema in
control-plane/crates/graphql-server/src/types/temp_artifact_inventory.rs (type
names, the canonical `mode` field/`InventoryMode` enum, and the dry-run and
mutation-guard shapes all match). Type/enum/field declarations below are
verified against live `Schema::build(...).sdl()` introspection output by the
`p089_graphql_sdl_fixture_matches_shipped_schema` gate test in
control-plane/crates/graphql-server/src/schema.rs — a passing gate test is
required payload-conformance evidence, not just fixture presence.
ByteCountString and DateTime scalars are required; the camelCase projection is
a lossless mapping of the snake_case canonical DTO (see
docs/reference/managed-temporary-artifact-inventory.md §4).
"""

scalar ByteCountString
scalar DateTime
scalar JSON

enum InventoryStatus {
  COMPLETE
  PARTIAL
  TIMEOUT
  CANCELLED
  ERROR
  DISABLED
  RESOURCE_EXHAUSTED
  UNKNOWN
}

enum InventoryEnabledState {
  ENABLED
  DISABLED
  UNKNOWN
}

enum InventoryMode {
  DISABLED
  HIDDEN_READBACK
  OPERATOR_VISIBLE
}

enum LifecycleClassification {
  ACTIVE_OR_RECENT
  TERMINAL_CANDIDATE
  ORPHAN_CANDIDATE
  LEGACY_UNMANAGED
  SCAN_ERROR
  UNKNOWN
}

enum DryRunRecommendation {
  WOULD_KEEP_ACTIVE
  WOULD_KEEP_RECENT
  WOULD_PRESERVE_FAILURE_EVIDENCE
  WOULD_DELETE_AFTER_FUTURE_APPROVAL
  WOULD_MIGRATE_LEGACY_MANIFEST_AFTER_FUTURE_MIGRATION_ENABLED
  NEEDS_OPERATOR_REVIEW
  NO_RECOMMENDATION
  UNKNOWN
}

enum MutationGuardStatus {
  PASS
  FAIL
  SKIPPED
  UNKNOWN
}

enum RootKind {
  RUN_META_ROOT
  CONTROL_PLANE_CACHE
  PROVIDER_HOME_COPY
  LEGACY_CHAINWORKS_TMP
  DIAGNOSTIC_TEST_ROOT
  UNKNOWN
}

enum InventoryErrorCode {
  INVALID_ROOT_OVERRIDE
  ROOT_UNREADABLE
  MANIFEST_PARSE_FAILED
  SIZE_ESTIMATION_FAILED
  DEADLINE_EXCEEDED
  CANCELLED
  INTERNAL_ERROR
  MUTATION_GUARD_FAILED
  RESOURCE_EXHAUSTED
  UNKNOWN
}

input TempArtifactWorkspaceContextInput {
  workspaceRoot: String!
}

input TempArtifactInventoryInput {
  runId: ID
  workspaceContext: TempArtifactWorkspaceContextInput
  limit: Int! = 500
  timeoutMs: Int! = 5000
  includeDryRun: Boolean! = true
  testRootOverride: String
}

type TempArtifactInventoryLimitsApplied {
  limit: Int!
  timeoutMs: Int!
  scanDeadlineAt: DateTime
  queueWaitMs: Int!
}

type TempArtifactInventorySummary {
  artifactTreeCount: Int!
  estimatedBytes: ByteCountString!
  activeOrRecentCount: Int!
  terminalCandidateCount: Int!
  orphanCandidateCount: Int!
  legacyUnmanagedCount: Int!
  scanErrorCount: Int!
  dryRunCandidateCount: Int!
  truncated: Boolean!
  queueWaitMs: Int!
}

type TempArtifactDryRunMutationGuard {
  status: MutationGuardStatus!
  checkedAt: DateTime!
}

type TempArtifactDryRun {
  schemaVersion: String!
  generatedAt: DateTime
  recommendationCounts: JSON!
  mutationGuard: TempArtifactDryRunMutationGuard!
}

type TempArtifactMutationGuard {
  status: MutationGuardStatus!
  checkedAt: DateTime!
  noDelete: Boolean!
  noPrune: Boolean!
  noChmod: Boolean!
  noPersist: Boolean!
  noRetry: Boolean!
}

type TempArtifactRow {
  pathDisplay: String!
  pathHash: String!
  pathHashShort: String!
  correlationKey: String!
  rootKind: RootKind!
  artifactKind: String
  manifestState: String
  lifecycleClassification: LifecycleClassification!
  dryRunRecommendation: DryRunRecommendation
  estimatedSizeBytes: ByteCountString!
  lastTouchedAt: DateTime
  activeProcessEvidence: String
  owner: String
  ownerInference: String
  statusToken: String!
  generatedAt: DateTime!
  partialErrors: [String!]!
}

type TempArtifactError {
  code: InventoryErrorCode!
  message: String!
  rootKind: RootKind
  phase: String
}

type TempArtifactInventory {
  schemaVersion: String!
  status: InventoryStatus!
  enabledState: InventoryEnabledState!
  mode: InventoryMode!
  disabledReasonCode: String
  generatedAt: DateTime!
  limitsApplied: TempArtifactInventoryLimitsApplied!
  summary: TempArtifactInventorySummary!
  rows: [TempArtifactRow!]!
  errors: [TempArtifactError!]!
  dryRun: TempArtifactDryRun
  mutationGuard: TempArtifactMutationGuard!
}

type Query {
  tempArtifactInventory(input: TempArtifactInventoryInput!): TempArtifactInventory!
}
