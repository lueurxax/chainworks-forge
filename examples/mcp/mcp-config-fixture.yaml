extensions:
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
    available_tools: []
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: Analyze code structure
    display_name: Analyze
    bundled: true
    available_tools: []
  context7:
    enabled: true
    type: stdio
    name: Context7
    description: Use up-to-date code and docs
    cmd: npx
    args:
      - -y
      - "@upstash/context7-mcp"
    envs: {}
    env_keys: []
    timeout: 300
    bundled: false
    available_tools: []
  xcode:
    enabled: true
    type: stdio
    name: XcodeBuildMCP
    description: Build and test Apple projects
    cmd: npx
    args:
      - -y
      - xcodebuildmcp@latest
    envs: {}
    env_keys: []
    timeout: 300
    bundled: false
    available_tools: []
