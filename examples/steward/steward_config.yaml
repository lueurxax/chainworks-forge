schema_version: 1

windows:
  observation_window_size: 20
  baseline_window_size: 20
  minimum_window_size: 5
  maximum_window_age_days: 90

thresholds:
  timing:
    method: median_percentage
    trigger: 0.30
  rework:
    method: mean_percentage
    trigger: 0.50
  quality:
    method: ratio
    trigger: 2.0
  cost:
    method: median_percentage
    trigger: 0.25
  stability:
    method: ratio
    trigger: 2.0

triggers:
  post_run_hook:
    enabled: false
    run_interval: 5
  on_config_change:
    enabled: true
  schedule:
    enabled: false
    cron: "0 8 * * 1"
