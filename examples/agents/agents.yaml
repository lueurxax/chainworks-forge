  proposal_review_summary: ${CHAINWORKS_META_ROOT:-.chainworks}/reviews/proposal/summary.json
  review_corpus_bundle: ${CHAINWORKS_META_ROOT:-.chainworks}/reviews/proposal/review-corpus-bundle.json
  agent_selection_plan_v1: ${CHAINWORKS_META_ROOT:-.chainworks}/routing/agent-selection-plan.v1.json
  review_corpus_bundle_v2: ${CHAINWORKS_META_ROOT:-.chainworks}/routing/review-corpus-bundle.v2.json
