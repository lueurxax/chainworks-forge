skills:
  proposal_review_triad:
    type: inline_skill
    description: >-
      Deprecated compatibility alias for old snapshots that still reference the
      proposal review triad. Use proposal_review_router_skill for all current
      proposal reviewer agents. Run proposal-first, evidence-backed review through
      the requested role lens and output only the proposal_review_v1 contract.
  proposal_review_router_skill:
    type: inline_skill
    description: >-
      Proposal-first review router and specialist reviewer skill. In routing mode,
      build evidence-backed stack, surface, and risk tags, then select the smallest
      sufficient reviewer set. In specialist role mode, review the proposal through
      the requested lens only, using local proposal/docs/reference evidence first,
      and output only the declared structured review contract. Do not require
      build, daemon startup, UI smoke, benchmarks, fuzzing, or live runtime proof
      in proposal-readiness review unless the user explicitly asks for runtime
      validation.
  proposal_implementation_audit:
    type: inline_skill
    description: >-
      Proposal-vs-implementation audit skill. Compare the approved proposal against
      the current implementation with evidence-first requirement conformance and
      readiness findings. Inspect only relevant code, tests, configs, docs, and
      artifacts; run focused validation when useful; write exactly one structured
      audit report and do not modify implementation or proposal files.
  docs_quality_guardian:
    type: builtin_agent
    name: docs-quality-guardian
  orchestrator_core:
    type: inline_skill
    description: Lead orchestration, fan-out/fan-in, gatekeeping, loop control, artifact routing.
  proposal_writer_core:
    type: inline_skill
    description: Draft and refine product/technical proposals from idea + review feedback.
  code_writer_core:
    type: inline_skill
    description: Implement approved proposal incrementally in a dedicated worktree.
  security_checker_core:
    type: inline_skill
    description: Threat-model and review the implementation for security, privacy, secrets, auth, and unsafe defaults.
  prepush_review_core:
    type: inline_skill
    description: Final code review barrier before commit/push; looks for correctness, readability, regressions, and missing tests.
  github_commit_push:
    type: inline_skill
    description: Use deterministic git/github tools to commit and push only after human release approval.
  connect_publisher:
    type: inline_skill
    description: Build release archive, compute checksum, and upload to Connect through deterministic tools.
  steward_core:
    type: inline_skill
    description: System-level SDLC health analysis, anomaly detection, and change proposal generation.
contracts:
  proposal_review_v1:
    format: json
    machine_format: json
    validation_mode: strict_structured
    raw_artifact_name: proposal_review_raw
    normalized_artifact_name: proposal_review_normalized
    required_fields:
      - agent_id
      - role
      - score
      - decision
      - verdict
      - summary
      - issues
      - blocking_issues
      - non_blocking_issues
      - suggestions
      - assumptions
  LeadResolutionContract:
    format: json
    machine_format: json
    validation_mode: strict_structured
    raw_artifact_name: lead_resolution_raw
    normalized_artifact_name: lead_resolution
    required_fields:
      - resolution_mode
      - requires_operator_confirmation
      - recommended_action
      - rationale_summary
  proposal_review_summary_v2:
    format: json
    machine_format: json
    validation_mode: strict_structured
    raw_artifact_name: proposal_review_summary_raw
    normalized_artifact_name: proposal_review_summary
    required_fields:
      - pass
      - average_score
      - aggregate_score
      - min_individual_score
      - blocker_count
      - blocking_issues
      - summary
      - blocking_required_changes
      - advisory_follow_ups
      - recurring_themes
