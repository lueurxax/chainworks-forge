schema_version: 1
workflow:
  id: full_mvp_live
  name: Full MVP Live
  uses_agent_catalog: ./agents.yaml
  description: First repo-backed end-to-end dogfood workflow. Idea through proposal, implementation in a dedicated worktree, review quartet, manual release gate, and durable receipts.
  idea_input:
    mode: text_with_optional_file
  execution:
    single_active_run_per_idea: true
    resume_policy: automatic_on_launch
    requires_project_access: true
  required_providers:
    - codex_acp
    - claude_acp
    - junie
variables:
  proposal_score_target: 8.5
  min_individual_proposal_score: 8
  audit_target_status: implemented
  implementation_review_target_status: code_complete
  max_proposal_revision_cycles: 15
  max_implementation_progress_cycles: 50
  max_implementation_revision_cycles: 22
failure_policy:
  on_error: pause_and_require_human
  on_loop_budget_exhausted: pause_and_require_human
  preserve_artifacts: true
scoring:
  proposal:
    aggregate_formula: proposal_review_summary.average_score_from_selected_reviewers
    pass_when:
      - average_score >= vars.proposal_score_target
      - min_individual_score >= vars.min_individual_proposal_score
      - blocker_count == 0
  implementation:
    implemented_when:
      - audit_report.status == vars.audit_target_status
      - security_report.status == 'pass'
      - prepush_review_report.status == 'pass'
      - docs_report.status in ['pass', 'not_needed']
      - tests_result.status == 'green'
initial_state: state_1_idea_received
states:
  state_1_idea_received:
    label: Idea received
    type: start
    owner: lead_orchestrator
    run:
      sequence:
        - agent: lead_orchestrator
          task: normalize_idea_and_open_run
          inputs:
            - input.idea
            - input.file
          outputs:
            - idea_brief
            - run_state
            - orchestrator_summary
    transitions:
      - to: state_2_proposal_drafted
        when: exists('idea_brief')

  state_2_proposal_drafted:
    label: Proposal drafted
    owner: proposal_writer
    run:
      sequence:
        - agent: proposal_writer
          task: draft_initial_proposal
          inputs:
            - idea_brief
            - run_state
          outputs:
            - proposal_current
            - proposal_revision_summary
    transitions:
      - to: state_3_initial_proposal_approval
        when: exists('proposal_current')

  state_3_initial_proposal_approval:
    label: "Human approval: initial proposal matches intent"
    type: manual_gate
    owner: lead_orchestrator
    approval: required
    transitions:
      - to: state_4_proposal_reviewed
        when: approval.granted == true

  state_4_proposal_reviewed:
    label: Proposal reviewed
    owner: lead_orchestrator
    run:
      system_task:
        task_type: proposal_review_router
        executor_mode: system.routing
      dynamic_parallel:
        selector_artifact: agent_selection_plan_v1
        output_contract: proposal_review_v1
        inputs:
          - idea_brief
          - proposal_current
          - proposal_feedback_coverage
          - reviewer_scope_plan
          - score_lift_backlog
      then:
        - agent: lead_orchestrator
          task: aggregate_proposal_reviews
          inputs:
            - proposal_current
          outputs:
            - proposal_review_summary
            - review_corpus_bundle_v2
            - score_lift_backlog
            - proposal_fact_digest
            - reviewer_scope_plan
            - orchestrator_summary
            - run_state
          selected_outputs_from:
            source_plan: agent_selection_plan_v1
            output_contract: proposal_review_v1
    transitions:
      - to: state_5_proposal_refined
        when: proposal_review_summary.average_score < vars.proposal_score_target or proposal_review_summary.min_individual_score < vars.min_individual_proposal_score or proposal_review_summary.blocker_count > 0
      - to: state_5a_proposal_decomposition_reviewed
        when: proposal_review_summary.average_score >= vars.proposal_score_target and proposal_review_summary.min_individual_score >= vars.min_individual_proposal_score and proposal_review_summary.blocker_count == 0

  state_5a_proposal_decomposition_reviewed:
    label: Proposal decomposition reviewed
    owner: lead_orchestrator
    run:
      sequence:
        - agent: lead_orchestrator
          task: decompose_proposal_before_implementation
          inputs:
            - proposal_current
            - proposal_review_summary
            - run_state
          outputs:
            - proposal_decomposition_plan
    transitions:
      - to: state_5_proposal_refined
        when: proposal_decomposition_plan.requires_split == true
      - to: state_6_implementation_approval
        when: proposal_decomposition_plan.implementation_start_decision == 'ready_with_declared_boundaries'

  state_5_proposal_refined:
    label: Proposal refined
    owner: proposal_writer
    run:
      sequence:
        - agent: proposal_writer
          task: refine_proposal
          inputs:
            - idea_brief
            - proposal_current
            - proposal_review_summary
            - review_corpus_bundle_v2
            - score_lift_backlog
            - proposal_fact_digest
            - run_state
          outputs:
            - proposal_current
            - proposal_revision_summary
            - proposal_feedback_coverage
    loop:
      counter: proposal_revision_count
      max: vars.max_proposal_revision_cycles
    transitions:
      - to: state_4_proposal_reviewed
        when: "true"

  state_6_implementation_approval:
    label: "Human approval: proceed to implementation"
    type: manual_gate
    owner: lead_orchestrator
    approval: required
    transitions:
      - to: state_7_implementation_started
        when: approval.granted == true
      - to: state_5_proposal_refined
        when: approval.rejected == true

  state_7_implementation_started:
    label: Implementation started
    owner: lead_orchestrator
    run:
      sequence:
        - agent: lead_orchestrator
          task: freeze_proposal_and_provision_worktree
          inputs:
            - proposal_current
            - proposal_review_summary
            - run_state
          outputs:
            - approved_proposal
            - implementation_plan
            - implementation_backlog
            - run_state
        - agent: code_writer
          task: initial_implementation
          inputs:
            - approved_proposal
            - implementation_plan
            - implementation_backlog
          outputs:
            - implementation_progress
            - implementation_self_assessment
            - changed_files_manifest
            - tests_result
    transitions:
      - to: state_8_implementation_continued
        when: implementation_self_assessment_v2.status == 'needs_code_fixes' or implementation_self_assessment_v2.status == 'invalid' or implementation_self_assessment_v2.status == 'unknown'
      - to: state_9_implementation_reviewed
        when: implementation_self_assessment_v2.status == 'complete' or implementation_self_assessment_v2.status == 'handoff_required' or implementation_self_assessment_v2.status == 'blocked'

  state_8_implementation_continued:
    label: Implementation continued until code-owned work is resolved
    owner: code_writer
    run:
      sequence:
        - agent: code_writer
          task: continue_implementation
          inputs:
            - approved_proposal
            - implementation_plan
            - implementation_progress
            - implementation_self_assessment
          outputs:
            - implementation_progress
            - implementation_self_assessment
            - changed_files_manifest
            - tests_result
    loop:
      counter: implementation_progress_count
      max: vars.max_implementation_progress_cycles
    transitions:
      - to: state_9_implementation_reviewed
        when: implementation_self_assessment_v2.status == 'complete' or implementation_self_assessment_v2.status == 'handoff_required' or implementation_self_assessment_v2.status == 'blocked'
      - to: state_8_implementation_continued
        when: implementation_self_assessment_v2.status == 'needs_code_fixes' or implementation_self_assessment_v2.status == 'invalid' or implementation_self_assessment_v2.status == 'unknown'

  state_9_implementation_reviewed:
    label: Implementation reviewed against proposal
    owner: lead_orchestrator
    run:
      parallel:
        - agent: security_checker
          task: check_implementation_security
          inputs:
            - approved_proposal
            - changed_files_manifest
          outputs:
            - security_report
        - agent: docs_guardian
          task: review_and_sync_docs
          inputs:
            - approved_proposal
            - changed_files_manifest
          outputs:
            - docs_report
            - docs_delta
      then:
        - agent: proposal_implementation_auditor
          task: audit_implementation_against_proposal
          inputs:
            - approved_proposal
            - implementation_progress
            - changed_files_manifest
            - tests_result
            - docs_report
          outputs:
            - audit_report
        - agent: prepush_code_reviewer
          task: prepush_review
          inputs:
            - approved_proposal
            - changed_files_manifest
            - audit_report
            - security_report
          outputs:
            - prepush_review_report
        - agent: lead_orchestrator
          task: aggregate_implementation_reviews
          inputs:
            - security_report
            - docs_report
            - audit_report
            - prepush_review_report
            - approved_proposal
            - implementation_self_assessment
          outputs:
            - implementation_review_summary
            - orchestrator_summary
            - run_state
    transitions:
      - to: state_11_manual_release
        when: implementation_closeout_readiness_v1.decision == 'enter_manual_release'
      - to: state_9_quality_gate_blocker_assessed
        when: implementation_closeout_readiness_v1.decision == 'return_to_code_refine'

  state_9_quality_gate_blocker_assessed:
    label: Quality-gate blocker assessment
    owner: lead_orchestrator
    run:
      sequence:
        - agent: lead_orchestrator
          task: assess_quality_gate_blockers
          inputs:
            - approved_proposal
            - implementation_self_assessment
            - implementation_review_summary
            - audit_report
            - security_report
            - prepush_review_report
            - docs_report
            - changed_files_manifest
            - tests_result
          outputs:
            - quality_gate_blocker_assessment
    transitions:
      - to: state_9_quality_gate_boundary_evaluated
        when: exists('quality_gate_blocker_assessment')

  state_9_quality_gate_boundary_evaluated:
    label: Quality-gate blocker boundary evaluated
    owner: lead_orchestrator
    run:
      system_task:
        task_type: quality_gate_boundary_evaluator
        executor_mode: system.quality_gate_boundary
    transitions:
      - to: state_9_output_settlement_recovery
        when: blocker_boundary_status.status == 'output_settlement_required'
      - to: state_9_side_effect_reconciliation
        when: blocker_boundary_status.status == 'side_effect_reconciliation_required'
      - to: state_9_runtime_recovery
        when: blocker_boundary_status.status == 'runtime_recovery_required'
      - to: state_9_implementation_reviewed
        when: blocker_boundary_status.status == 'review_refresh_required'
      - to: state_10_implementation_refined
        when: blocker_boundary_status.status == 'local_code_tail_present'
      - to: state_9_implementation_reviewed
        when: blocker_boundary_status.status == 'invalid_claim'
      - to: state_9_blocker_boundary_approval
        when: blocker_boundary_status.status == 'blocked_no_progress'
      - to: state_9_blocker_boundary_approval
        when: blocker_boundary_status.status == 'awaiting_human_boundary_approval'
      - to: state_11_manual_release
        when: blocker_boundary_status.status == 'pass'

  state_9_blocker_boundary_approval:
    label: "Human approval: blocker boundary assessment"
    type: manual_gate
    owner: lead_orchestrator
    approval: required
    transitions:
      - to: state_9_blocker_boundary_accepted
        when: approval.granted == true
      - to: state_9_implementation_reviewed
        when: approval.rejected == true

  state_9_output_settlement_recovery:
    label: Output settlement recovery
    owner: lead_orchestrator
    run:
      sequence:
        - agent: lead_orchestrator
          task: recover_quality_gate_output_settlement
          inputs:
            - blocker_boundary_status
            - implementation_review_summary
          outputs:
            - orchestrator_summary
            - run_state
    transitions:
      - to: state_9_implementation_reviewed
        when: exists('orchestrator_summary')

  state_9_side_effect_reconciliation:
    label: Side-effect reconciliation
    owner: lead_orchestrator
    run:
      sequence:
        - agent: lead_orchestrator
          task: reconcile_quality_gate_side_effects
          inputs:
            - blocker_boundary_status
            - implementation_review_summary
          outputs:
            - orchestrator_summary
            - run_state
    transitions:
      - to: state_9_implementation_reviewed
        when: exists('orchestrator_summary')

  state_9_runtime_recovery:
    label: Runtime recovery
    owner: lead_orchestrator
    run:
      sequence:
        - agent: lead_orchestrator
          task: recover_quality_gate_runtime
          inputs:
            - blocker_boundary_status
            - implementation_review_summary
          outputs:
            - orchestrator_summary
            - run_state
    transitions:
      - to: state_9_implementation_reviewed
        when: exists('orchestrator_summary')

  state_9_blocker_boundary_accepted:
    label: Blocker boundary accepted
    owner: lead_orchestrator
    run:
      sequence:
        - agent: lead_orchestrator
          task: emit_blocker_boundary_closeout
          inputs:
            - blocker_boundary_status
            - implementation_review_summary
          outputs:
            - orchestrator_summary
    transitions:
      - to: state_9_followup_proposal_seeded
        when: blocker_boundary_status.followup_proposal_required == true
      - to: state_9_external_evidence_blocked
        when: blocker_boundary_status.has_release_blocking_external_blockers == true and blocker_boundary_status.followup_proposal_required == false
      - to: state_11_manual_release
        when: blocker_boundary_status.has_no_release_blocking_external_blockers == true and blocker_boundary_status.followup_proposal_required == false

  state_9_followup_proposal_seeded:
    label: Follow-up proposal seed generated
    owner: lead_orchestrator
    run:
      sequence:
        - agent: lead_orchestrator
          task: generate_followup_proposal_seed
          inputs:
            - blocker_boundary_status
            - approved_proposal
          outputs:
            - followup_proposal_seed
    transitions:
      - to: state_9_external_evidence_blocked
        when: exists('followup_proposal_seed')

  state_9_external_evidence_blocked:
    label: External evidence blocked
    owner: lead_orchestrator
    run:
      sequence:
        - agent: lead_orchestrator
          task: record_external_evidence_hold
          inputs:
            - blocker_boundary_status
            - followup_proposal_seed
          outputs:
            - orchestrator_summary
            - run_state
    transitions:
      - to: state_9_external_evidence_blocked
        when: "false"

  state_10_implementation_refined:
    label: Implementation refined
    owner: code_writer
    run:
      sequence:
        - agent: code_writer
          task: refine_implementation
          inputs:
            - approved_proposal
            - audit_report
            - security_report
            - prepush_review_report
            - implementation_review_summary
          outputs:
            - implementation_progress
            - implementation_self_assessment
            - changed_files_manifest
            - tests_result
        - agent: docs_guardian
          task: sync_docs_after_refinement
          inputs:
            - approved_proposal
            - changed_files_manifest
          outputs:
            - docs_report
            - docs_delta
    loop:
      counter: implementation_revision_count
      max: vars.max_implementation_revision_cycles
    transitions:
      - to: state_9_implementation_reviewed
        when: "true"

  state_11_manual_release:
    label: Manual release
    type: manual_gate
    owner: lead_orchestrator
    approval: required
    approval_policy: manual_release
    run_after_approval:
      sequence:
        - agent: commit_and_push_to_github
          task: commit_and_push
          inputs:
            - approved_proposal
            - implementation_review_summary
            - docs_report
            - prepush_review_report
          outputs:
            - release_manifest
            - git_push_receipt
        - agent: build_archive_and_push_connect
          task: build_and_distribute
          inputs:
            - git_push_receipt
            - release_manifest
          outputs:
            - release_bundle_manifest
            - connect_upload_receipt
    transitions:
      - to: state_12_workflow_complete
        when: exists('git_push_receipt')

  state_12_workflow_complete:
    label: Workflow complete
    type: end
    owner: lead_orchestrator
    run:
      sequence:
        - agent: lead_orchestrator
          task: finalize_run_and_produce_receipts
          inputs:
            - approved_proposal
            - implementation_review_summary
            - release_manifest
            - git_push_receipt
            - release_bundle_manifest
            - connect_upload_receipt
          outputs:
            - delivery_receipt
            - run_report
            - run_state
    transitions:
      - to: state_12_workflow_complete
        when: "true"
