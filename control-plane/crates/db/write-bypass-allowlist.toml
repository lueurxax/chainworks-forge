# P075 Direct-write bypass allowlist.
#
# All non-test runtime write transactions must route through DbWriter or be listed here.
# The proposal-075 gate (Phase 7, fail-closed) fails on:
#   - observed runtime write owners not listed in this file
#   - entries missing required fields
#   - entries whose expires_after_phase has passed
#
# Required fields for every entry:
#   id                  - stable identifier, never reused
#   owner               - crate::module::fn or qualified path owning the bypass
#   reason              - short rationale for the bypass
#   scope               - "migrations", "tests", "startup_repair", or "temporary_rollout"
#   path_pattern        - glob-style path fragment matching call sites
#   allowed_context     - when this bypass is permitted (e.g. "schema migrations only")
#   retirement_criteria - observable condition that proves the bypass can be removed
#   expires_after_phase - phase number (1-8); gate fails if current phase exceeds this
#
# Phase 1: inventory mode only.  No temporary_rollout entries are needed yet.
# Migrations, tests, and startup repair are permanent categories and do not expire.

[[bypasses]]
id = "bypass-001"
owner = "db::migrate"
reason = "Schema migrations run before DbWriter is available; they own the schema write path."
scope = "migrations"
path_pattern = "crates/db/src/migrate.rs"
allowed_context = "Schema migration execution only, before pool creation."
retirement_criteria = "Never retire; migrations are a permanent allowed bypass category."
expires_after_phase = 8

[[bypasses]]
id = "bypass-002"
owner = "db::pool::create_pool"
reason = "Pool creation and preflight checks are infrastructure; they precede DbWriter construction."
scope = "migrations"
path_pattern = "crates/db/src/pool.rs"
allowed_context = "Pool initialisation and migration preflight only."
retirement_criteria = "Never retire; pool setup is a permanent allowed bypass category."
expires_after_phase = 8

[[bypasses]]
id = "bypass-003"
owner = "db::repos::*"
reason = "All existing repo write paths are legacy direct writes pending migration to DbWriter in Phases 2–5."
scope = "temporary_rollout"
path_pattern = "crates/db/src/repos/"
allowed_context = "Existing write paths in Phase 1 before DbWriter routing is wired."
retirement_criteria = "Each repo write path is routed through DbWriter and removed from this bypass. Monotonically decreasing inventory required across Phases 2–5."
expires_after_phase = 5

[[bypasses]]
id = "bypass-004"
owner = "db::tests"
reason = "Isolated test and fixture code may write directly to construct known state."
scope = "tests"
path_pattern = "crates/db/src/**/*tests*"
allowed_context = "#[cfg(test)] blocks and test helper functions only."
retirement_criteria = "Never retire; tests are a permanent allowed bypass category."
expires_after_phase = 8

[[bypasses]]
id = "bypass-005"
owner = "db::repos::startup_repairs"
reason = "Startup repair and orphan-sweep recovery code runs before normal write path is ready."
scope = "startup_repair"
path_pattern = "crates/db/src/repos/startup_repairs.rs"
allowed_context = "Startup repair execution and orphan recovery sweep only."
retirement_criteria = "Never retire; startup repair is a permanent allowed bypass category."
expires_after_phase = 8
