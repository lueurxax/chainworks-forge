retirement_criteria = "insert, insert_tx, insert_idempotent, and update_status in evidence_spool_refs.rs all route through DbWriter. Verify by absence of pool.begin() or execute(&pool) write calls outside #[cfg(test)] in this file."
expires_after_phase = 2

