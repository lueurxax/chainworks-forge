[package]
name = "mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { path = "../domain" }
db = { path = "../db" }
engine = { path = "../engine" }
auth = { path = "../auth" }
# P042 §9.3: share the `RequestId` axum Extension + middleware helpers
# so MCP HTTP reads the same type the middleware inserts.
graphql-server = { path = "../graphql-server" }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
