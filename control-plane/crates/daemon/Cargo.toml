[package]
name = "daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "control-plane"
path = "src/main.rs"

[dependencies]
domain = { path = "../domain" }
db = { path = "../db" }
acp = { path = "../acp" }
engine = { path = "../engine" }
graphql-server = { path = "../graphql-server" }
mcp-server = { path = "../mcp-server" }
auth = { path = "../auth" }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
dirs = "5"
sha2 = "0.10"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing-appender = "0.2"
tokio = { workspace = true }
# P042 §6.1: advisory exclusive PID lock via flock.
fs2 = "0.4"
# P042 §6.1: kill(pid, 0) liveness probe for the stale-PID detection path.
libc = "0.2"
# P042 §5.2: failed-serve mode needs its own minimal axum router.
axum = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = "0.5"
# P042 §9.1 log-retention tests need to forge mtime on fixture files.
filetime = "0.2"
