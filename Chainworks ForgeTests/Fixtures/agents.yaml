schema_version: 1
app:
  name: Chainworks
  runtime: goose
  transport: rest_sse
  description: Multi-agent catalog for a single-engineer workflow constructor/executor.
  idea_input_mode: text_with_optional_file
  single_active_run_per_idea: true
  run_resume_policy: automatic_on_launch
  required_providers:
  - codex
  - claude_code
paths:
  repo_root: ${CHAINWORKS_REPO_ROOT:-.}
  meta_root: ${CHAINWORKS_META_ROOT:-.chainworks}
  worktrees_root: ${CHAINWORKS_WORKTREES_ROOT:-.chainworks/worktrees}
  implementation_worktree: ${CHAINWORKS_IMPLEMENTATION_WORKTREE:-.chainworks/worktrees/implementation}
artifacts:
  idea_brief: ${CHAINWORKS_META_ROOT:-.chainworks}/context/idea.md
  proposal_current: ${CHAINWORKS_META_ROOT:-.chainworks}/proposals/current/proposal.md
  proposal_revision_summary: ${CHAINWORKS_META_ROOT:-.chainworks}/proposals/current/revision-summary.md
  proposal_review_po: ${CHAINWORKS_META_ROOT:-.chainworks}/reviews/proposal/product-owner.json
  proposal_review_ux: ${CHAINWORKS_META_ROOT:-.chainworks}/reviews/proposal/ux.json
  proposal_review_ui: ${CHAINWORKS_META_ROOT:-.chainworks}/reviews/proposal/ui.json
  proposal_review_architect: ${CHAINWORKS_META_ROOT:-.chainworks}/reviews/proposal/architect.json
  proposal_review_summary: ${CHAINWORKS_META_ROOT:-.chainworks}/reviews/proposal/summary.json
  approved_proposal: ${CHAINWORKS_META_ROOT:-.chainworks}/proposals/approved/proposal.md
  implementation_plan: ${CHAINWORKS_META_ROOT:-.chainworks}/implementation/plan.md
  implementation_backlog: ${CHAINWORKS_META_ROOT:-.chainworks}/implementation/backlog.yaml
  implementation_progress: ${CHAINWORKS_META_ROOT:-.chainworks}/implementation/progress.md
  implementation_self_assessment: ${CHAINWORKS_META_ROOT:-.chainworks}/implementation/self-assessment.json
  changed_files_manifest: ${CHAINWORKS_META_ROOT:-.chainworks}/implementation/changed-files.json
  tests_result: ${CHAINWORKS_META_ROOT:-.chainworks}/implementation/tests.json
  audit_report: ${CHAINWORKS_META_ROOT:-.chainworks}/audit/proposal-vs-implementation.json
  security_report: ${CHAINWORKS_META_ROOT:-.chainworks}/security/report.json
  prepush_review_report: ${CHAINWORKS_META_ROOT:-.chainworks}/review/prepush.json
  implementation_review_summary: ${CHAINWORKS_META_ROOT:-.chainworks}/review/implementation-summary.json
  docs_report: ${CHAINWORKS_META_ROOT:-.chainworks}/docs/report.json
  docs_delta: ${CHAINWORKS_META_ROOT:-.chainworks}/docs/changed-files.json
  run_state: ${CHAINWORKS_META_ROOT:-.chainworks}/state/run-state.json
  orchestrator_summary: ${CHAINWORKS_META_ROOT:-.chainworks}/summaries/orchestrator.md
  approval_request: ${CHAINWORKS_META_ROOT:-.chainworks}/approvals/current-request.json
  release_manifest: ${CHAINWORKS_META_ROOT:-.chainworks}/release/manifest.json
  git_push_receipt: ${CHAINWORKS_META_ROOT:-.chainworks}/release/git-push.json
  release_bundle_manifest: ${CHAINWORKS_META_ROOT:-.chainworks}/release/bundle.json
  connect_upload_receipt: ${CHAINWORKS_META_ROOT:-.chainworks}/release/connect-upload.json
  final_feature_report: ${CHAINWORKS_META_ROOT:-.chainworks}/summaries/final-feature-report.json
  # Steward artifacts (Proposal 003)
  metrics_window: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/metrics-window.json
  baseline_window: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/baseline-window.json
  implicated_run_dossiers: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/dossiers/
  agent_catalog_snapshot: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/catalog-snapshot.json
  workflow_snapshot: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/workflow-snapshot.json
  config_change_log: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/config-change-log.json
  sdlc_health_report: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/reports/health-report.json
  degradation_alert: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/reports/degradation-alert.json
  agent_tuning_proposal: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/proposals/agent-tuning.json
  workflow_tuning_proposal: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/proposals/workflow-tuning.json
  experiment_plan: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/proposals/experiment-plan.json
  stewardship_audit_report: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/reports/audit-report.json
  implicated_agent_dossier: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/dossiers/agent/
  source_artifacts: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/dossiers/source-artifacts/
  review_feedback: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/dossiers/review-feedback.json
  final_outcome: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/dossiers/final-outcome.json
  agent_retrospective_report: ${CHAINWORKS_META_ROOT:-.chainworks}/steward/reports/retrospective-report.json
skills:
  proposal_review_triad:
    type: external_skill
    path: /Users/user/.codex/skills/proposal-review-triad
    notes: Shared skill for PO / UX / UI / Architect proposal review lenses.
  proposal_implementation_audit:
    type: external_skill
    path: /Users/user/.codex/skills/proposal-implementation-audit
  docs_quality_guardian:
    type: builtin_agent
    name: docs-quality-guardian
  orchestrator_core:
    type: inline_skill
    description: Lead orchestration, fan-out/fan-in, gatekeeping, loop control, artifact routing.
  proposal_writer_core:
    type: inline_skill
    description: Draft and refine product/technical proposals from idea + review feedback.
  code_writer_core:
    type: inline_skill
    description: Implement approved proposal incrementally in a dedicated worktree.
  security_checker_core:
    type: inline_skill
    description: Threat-model and review the implementation for security, privacy, secrets, auth, and unsafe defaults.
  prepush_review_core:
    type: inline_skill
    description: Final code review barrier before commit/push; looks for correctness, readability, regressions, and missing tests.
  github_commit_push:
    type: inline_skill
    description: Use deterministic git/github tools to commit and push only after human release approval.
  connect_publisher:
    type: inline_skill
    description: Build release archive, compute checksum, and upload to Connect through deterministic tools.
  # Steward skill (Proposal 003)
  steward_core:
    type: inline_skill
    description: System-level SDLC health analysis, anomaly detection, and change proposal generation.
contracts:
  proposal_review_v1:
    format: json
    required_fields:
    - agent_id
    - role
    - score
    - decision
    - verdict
    - summary
    - issues
    - blocking_issues
    - non_blocking_issues
    - suggestions
    - assumptions
  proposal_review_summary_v1:
    format: json
    required_fields:
    - pass
    - average_score
    - aggregate_score
    - min_individual_score
    - blocker_count
    - summary
    - required_changes
    - recurring_themes
    - decision
  implementation_self_assessment_v1:
    format: json
    required_fields:
    - seemingly_complete
    - remaining_tasks
    - known_risks
    - tests_run
    - docs_impacted
  audit_report_v1:
    format: json
    required_fields:
    - status
    - matches_proposal
    - missing_items
    - extra_items
    - defects
    - required_fixes
  security_report_v1:
    format: json
    required_fields:
    - status
    - critical
    - high
    - medium
    - low
    - findings
    - required_fixes
  prepush_review_v1:
    format: json
    required_fields:
    - status
    - major_concerns
    - cleanup_items
    - test_coverage_notes
    - release_note
  implementation_review_summary_v1:
    format: json
    required_fields:
    - status
    - open_blockers
    - must_fix
    - recommended_next_step
  docs_report_v1:
    format: json
    required_fields:
    - status
    - changed_docs
    - missing_docs
    - followups
  git_push_receipt_v1:
    format: json
    required_fields:
    - status
    - branch
    - commit_sha
    - remote
  connect_upload_receipt_v1:
    format: json
    required_fields:
    - status
    - artifact_id
    - checksum
    - destination
  final_feature_report_v1:
    format: json
    required_fields:
    - final_status
    - summary
    - started_at
    - completed_at
    - duration_seconds
    - total_cost
    - cost_currency
  # Steward contracts (Proposal 003)
  sdlc_health_report_v1:
    format: json
    required_fields:
    - analysis_id
    - window_start
    - window_end
    - cohort_keys
    - cohort_quality
    - run_count
    - metrics_summary
    - baseline_summary
    - degradations
    - improvements
    - executive_summary
    - confidence
  stewardship_audit_report_v1:
    format: json
    required_fields:
    - analysis_id
    - claims_reviewed
    - claims_supported
    - claims_undersupported
    - alternate_explanations
    - recommendation_risk_review
    - safer_next_step
    - confidence
  agent_retrospective_report_v1:
    format: json
    required_fields:
    - analysis_id
    - agent_id
    - run_id
    - situation_reconstruction
    - expected_vs_actual
    - likely_failure_modes
    - evidence_refs
    - suggested_changes
    - confidence
backend_profiles:
  claude_orchestrator_high:
    provider: claude_code
    model: default
    effort: high
    temperature: 0.1
    max_turns: 20
    structured_output: required
  claude_writer_high:
    provider: claude_code
    model: default
    effort: high
    temperature: 0.2
    max_turns: 18
    structured_output: preferred
  claude_product_high:
