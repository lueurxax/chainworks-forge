      - ${CHAINWORKS_META_ROOT:-.chainworks}/state/**
      - ${CHAINWORKS_META_ROOT:-.chainworks}/summaries/**
      - ${CHAINWORKS_META_ROOT:-.chainworks}/approvals/**
      - ${CHAINWORKS_META_ROOT:-.chainworks}/implementation/plan.md
      - ${CHAINWORKS_META_ROOT:-.chainworks}/implementation/backlog.yaml
      - ${CHAINWORKS_META_ROOT:-.chainworks}/proposals/approved/**
      - ${CHAINWORKS_META_ROOT:-.chainworks}/reviews/**
      deny:
      - ${CHAINWORKS_REPO_ROOT:-.}/.git/**
      - ${CHAINWORKS_REPO_ROOT:-.}/**/.env*
      - ${CHAINWORKS_REPO_ROOT:-.}/**/secrets/**
    git:
      status: true
      diff: true
      checkout: false
      commit: false
      push: false
    shell:
      allow:
      - rg
      - fd
      - find
      - ls
      - cat
      - git status
      - git diff --stat
      - git diff --name-only
      deny:
      - git commit*
      - git push*
      - rm -rf *
    network:
      allow: []
    mcp:
      allow:
      - github.read
      - connect.read
