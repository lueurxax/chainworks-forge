    model: default
    effort: high
    temperature: 0.1
    max_turns: 16
    structured_output: required
  codex_builder_high:
    provider: codex
    model: default
    effort: high
    temperature: 0.1
    max_turns: 24
    structured_output: required
  codex_audit_high:
    provider: codex
    model: default
    effort: high
    temperature: 0.0
    max_turns: 18
    structured_output: required
  claude_security_high:
    provider: claude_code
    model: default
    effort: high
    temperature: 0.0
    max_turns: 16
    structured_output: required
  claude_prepush_medium:
    provider: claude_code
    model: default
    effort: medium
    temperature: 0.1
    max_turns: 12
    structured_output: required
  codex_ops_low:
    provider: codex
    model: default
    effort: low
    temperature: 0.0
    max_turns: 8
    structured_output: required
  claude_docs_medium:
    provider: claude_code
    model: default
    effort: medium
    temperature: 0.2
    max_turns: 12
    structured_output: required
  # Steward backend profiles (Proposal 003)
  claude_steward_high:
    provider: claude_code
    model: default
    effort: high
    temperature: 0.1
    max_turns: 16
    structured_output: required
  claude_auditor_medium:
    provider: claude_code
    model: default
    effort: medium
