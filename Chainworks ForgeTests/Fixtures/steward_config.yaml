schema_version: 1

windows:
  observation_window_size: 20
  baseline_window_size: 20
  minimum_window_size: 5
  maximum_window_age_days: 90

thresholds:
  timing:
    method: median_percentage
    trigger: 0.30
  rework:
    method: mean_percentage
    trigger: 0.50
  quality:
    method: ratio
    trigger: 2.0
  cost:
    method: median_percentage
    trigger: 0.25
  stability:
    method: ratio
    trigger: 2.0

context_strategy_profiles:
  current_mixed_baseline:
    default_handoff_mode: full_forward
    agents:
      "*":
        handoff_policy:
          mandatory:
            - current_task_description
          lazy:
            - "*"
  manual_like_long_continuity:
    default_handoff_mode: full_forward
    agents:
      lead_orchestrator:
        continuity_mode: family_within_run
      proposal_writer:
        continuity_mode: family_within_run
      "*":
        continuity_mode: none
        handoff_policy:
          mandatory:
            - current_task_description
          lazy:
            - "*"
  selective_compression_and_escalation:
    default_handoff_mode: selective
    default_model_tier: fast
    escalation_model_tier: frontier
    agents:
      proposal_writer:
        handoff_policy:
          mandatory:
            - idea_brief
            - proposal_current
            - review_corpus_bundle
            - proposal_review_po
            - proposal_review_ux
            - proposal_review_ui
            - proposal_review_architect
            - proposal_review_summary
            - score_lift_backlog
            - proposal_fact_digest
          lazy:
            - security_audit_raw
      "*":
        handoff_policy:
          mandatory:
            - current_task_description
          lazy:
            - "*"
  fresh_control:
    default_handoff_mode: full_forward
    default_model_tier: frontier
    agents:
      "*":
        continuity_mode: none
        handoff_policy:
          mandatory:
            - current_task_description
          lazy:
            - "*"

triggers:
  post_run_hook:
    enabled: false
    run_interval: 5
  on_config_change:
    enabled: true
  schedule:
    enabled: false
    cron: "0 8 * * 1"
